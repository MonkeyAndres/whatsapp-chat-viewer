name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "worker/**"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository checkout
        run: test -f package.json

      - name: Reject versioned worker evidence
        run: |
          tracked_worker_evidence="$(git ls-files .worker-evidence)"
          if [ -n "$tracked_worker_evidence" ]; then
            echo "::error::.worker-evidence/ must not be tracked in Git"
            printf '%s\n' "$tracked_worker_evidence"
            exit 1
          fi

      - name: Setup Node
        run: |
          curl -fsSLO https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz
          tar -xf node-v22.23.1-linux-x64.tar.xz
          echo "$PWD/node-v22.23.1-linux-x64/bin" >> "$GITHUB_PATH"
          "$PWD/node-v22.23.1-linux-x64/bin/node" --version
          "$PWD/node-v22.23.1-linux-x64/bin/npm" install --global yarn@1.22.22

      - name: Verify toolchain
        run: |
          node --version
          node --version | grep '^v22\.23\.1$'
          yarn --version
          yarn --version | grep '^1\.22\.22$'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run tests
        run: CI=true yarn test --watchAll=false

      - name: Build production bundle
        run: yarn build

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Run large chat Playwright test
        run: yarn test:e2e
