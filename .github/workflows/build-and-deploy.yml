name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject versioned worker evidence
        run: |
          tracked_worker_evidence="$(git ls-files .worker-evidence)"
          if [ -n "$tracked_worker_evidence" ]; then
            echo "::error::.worker-evidence/ must not be tracked in Git"
            printf '%s\n' "$tracked_worker_evidence"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: yarn

      - name: Setup Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: CI=true yarn test --watchAll=false

      - name: Build
        run: yarn build

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Test large chat reading
        run: yarn test:e2e

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
